name: Dependency Review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
