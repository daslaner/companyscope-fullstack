name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck browser, BFF and E2E code
        run: npm run typecheck

  unit:
    name: Unit + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage thresholds
        run: npm run test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build immutable artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production app and BFF
        run: npm run build:production
      - name: Build Storybook
        run: npm run build-storybook
      - name: Verify expected build outputs
        run: |
          test -f dist/index.html
          test -s server-dist/server.mjs
          test -f storybook-static/index.html
      - name: Upload production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-bundle-${{ github.sha }}
          path: |
            dist/
            server-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified Storybook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-${{ github.sha }}
          path: storybook-static/
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependency graph
        run: npm run audit:prod

  e2e:
    name: E2E / Chromium
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Download verified production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-bundle-${{ github.sha }}
          path: .
      - name: Run critical user journeys
        run: npm run test:e2e
      - name: Upload E2E diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout packaging contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-bundle-${{ github.sha }}
          path: .
      - name: Build runtime image from verified artifacts
        run: |
          docker build \
            --build-arg APP_VERSION=1.0.0 \
            --build-arg VCS_REF=${GITHUB_SHA} \
            --tag companyscope-ci:${GITHUB_SHA} \
            .
      - name: Smoke test runtime image
        run: |
          set -euo pipefail
          container_id=$(docker run --rm -d \
            -p 4100:4100 \
            -e APP_ORIGIN=http://127.0.0.1:4100 \
            -e SESSION_COOKIE_SECURE=false \
            companyscope-ci:${GITHUB_SHA})
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4100/api/health | grep -q '"status":"ok"'; then
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:4100/companies/northstar-berlin-security/security | grep -q 'id="root"'
      - name: Export tested container image
        run: docker save companyscope-ci:${GITHUB_SHA} | gzip -1 > companyscope-image.tar.gz
      - name: Upload tested container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-image-${{ github.sha }}
          path: companyscope-image.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs: [lint, typecheck, unit, build, audit, e2e, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality stage to pass
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          AUDIT: ${{ needs.audit.result }}
          E2E: ${{ needs.e2e.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          set -euo pipefail
          for result in "$LINT" "$TYPECHECK" "$UNIT" "$BUILD" "$AUDIT" "$E2E" "$CONTAINER"; do
            test "$result" = "success"
          done
          echo "All CompanyScope quality gates passed."
