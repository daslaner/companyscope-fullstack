version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 6
    # typescript-eslint 8.65.0 supports TypeScript >=4.8.4 <6.1.0.
    # Keep the compiler on the supported 6.0.x line until that peer range moves.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1.0']
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
